<!-- @format -->

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title
			th:text="${student.id != null} ? 'Chỉnh Sửa Sinh Viên' : 'Thêm Sinh Viên Mới'"
		>
			Form Sinh Viên
		</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
			rel="stylesheet"
		/>
		<style>
			body {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.card {
				border: none;
				border-radius: 15px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
				max-width: 500px;
				width: 100%;
			}
			.card-header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border-radius: 15px 15px 0 0 !important;
				padding: 1.5rem;
			}
			.form-control:focus {
				border-color: #667eea;
				box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
			}
			.btn-primary {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border: none;
			}
			.btn-primary:hover {
				background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
			}
			.form-label {
				font-weight: 500;
				color: #495057;
			}
			.input-group-text {
				background-color: #f8f9fa;
			}
		</style>
	</head>
	<body>
		<div class="container py-5">
			<div class="card mx-auto">
				<div class="card-header">
					<h4 class="mb-0 text-white text-center">
						<i
							class="bi bi-person-plus-fill me-2"
							th:if="${student.id == null}"
						></i>
						<i
							class="bi bi-pencil-square me-2"
							th:if="${student.id != null}"
						></i>
						<span
							th:text="${student.id != null} ? 'Chỉnh Sửa Sinh Viên' : 'Thêm Sinh Viên Mới'"
						></span>
					</h4>
				</div>
				<div class="card-body p-4">
					<form
						th:action="@{/students/save}"
						th:object="${student}"
						method="post"
					>
						<!-- MSSV -->
						<div class="mb-3">
							<label for="id" class="form-label">
								<i class="bi bi-hash me-1"></i>Mã số sinh viên
								(MSSV)
							</label>
							<div class="input-group">
								<span class="input-group-text"
									><i class="bi bi-card-text"></i
								></span>
								<input
									type="text"
									id="id"
									th:field="*{id}"
									class="form-control"
									placeholder="Nhập MSSV..."
									th:readonly="${student.id != null}"
									required
								/>
							</div>
							<div
								class="form-text"
								th:if="${student.id == null}"
							>
								MSSV sẽ không thể thay đổi sau khi tạo
							</div>
						</div>

						<!-- Họ tên -->
						<div class="mb-3">
							<label for="name" class="form-label">
								<i class="bi bi-person me-1"></i>Họ và tên
							</label>
							<div class="input-group">
								<span class="input-group-text"
									><i class="bi bi-person-fill"></i
								></span>
								<input
									type="text"
									id="name"
									th:field="*{name}"
									class="form-control"
									placeholder="Nhập họ và tên..."
									required
								/>
							</div>
						</div>

						<!-- Email -->
						<div class="mb-3">
							<label for="email" class="form-label">
								<i class="bi bi-envelope me-1"></i>Email
							</label>
							<div class="input-group">
								<span class="input-group-text"
									><i class="bi bi-envelope-fill"></i
								></span>
								<input
									type="email"
									id="email"
									th:field="*{email}"
									class="form-control"
									placeholder="example@email.com"
									required
								/>
							</div>
						</div>

						<!-- Tuổi -->
						<div class="mb-4">
							<label for="age" class="form-label">
								<i class="bi bi-calendar me-1"></i>Tuổi
							</label>
							<div class="input-group">
								<span class="input-group-text"
									><i class="bi bi-123"></i
								></span>
								<input
									type="number"
									id="age"
									th:field="*{age}"
									class="form-control"
									placeholder="Nhập tuổi..."
									min="1"
									max="100"
									required
								/>
							</div>
						</div>

						<!-- Buttons -->
						<div class="d-grid gap-2">
							<button
								type="submit"
								class="btn btn-primary btn-lg"
							>
								<i class="bi bi-check-circle me-2"></i>
								<span
									th:text="${student.id != null} ? 'Cập nhật' : 'Lưu sinh viên'"
								></span>
							</button>
							<a
								href="/students"
								class="btn btn-outline-secondary"
							>
								<i class="bi bi-arrow-left me-2"></i>Quay lại
								danh sách
							</a>
						</div>
					</form>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
