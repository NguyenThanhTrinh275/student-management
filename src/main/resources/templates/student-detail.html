<!-- @format -->

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title th:text="'Chi tiết - ' + ${student.name}">
			Chi tiết Sinh Viên
		</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
			rel="stylesheet"
		/>
		<style>
			body {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.card {
				border: none;
				border-radius: 15px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
				max-width: 500px;
				width: 100%;
			}
			.card-header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border-radius: 15px 15px 0 0 !important;
				padding: 2rem;
				text-align: center;
			}
			.avatar {
				width: 100px;
				height: 100px;
				background: white;
				border-radius: 50%;
				display: flex;
				align-items: center;
				justify-content: center;
				margin: 0 auto 1rem;
				font-size: 3rem;
				color: #667eea;
			}
			.info-item {
				display: flex;
				align-items: center;
				padding: 1rem;
				border-bottom: 1px solid #e9ecef;
			}
			.info-item:last-child {
				border-bottom: none;
			}
			.info-icon {
				width: 40px;
				height: 40px;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				border-radius: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				color: white;
				margin-right: 1rem;
			}
			.info-label {
				font-size: 0.85rem;
				color: #6c757d;
				margin-bottom: 0.25rem;
			}
			.info-value {
				font-size: 1.1rem;
				font-weight: 500;
				color: #212529;
			}
			.btn-action {
				padding: 0.75rem 1.5rem;
			}
		</style>
	</head>
	<body>
		<div class="container py-5">
			<div class="card mx-auto">
				<div class="card-header">
					<div class="avatar">
						<i class="bi bi-person-fill"></i>
					</div>
					<h3 class="text-white mb-1" th:text="${student.name}">
						Họ và Tên
					</h3>
					<span
						class="badge bg-light text-dark"
						th:text="'MSSV: ' + ${student.id}"
						>MSSV</span
					>
				</div>
				<div class="card-body p-0">
					<!-- Email -->
					<div class="info-item">
						<div class="info-icon">
							<i class="bi bi-envelope-fill"></i>
						</div>
						<div>
							<div class="info-label">Email</div>
							<div class="info-value" th:text="${student.email}">
								email@example.com
							</div>
						</div>
					</div>

					<!-- Tuổi -->
					<div class="info-item">
						<div class="info-icon">
							<i class="bi bi-calendar-heart"></i>
						</div>
						<div>
							<div class="info-label">Tuổi</div>
							<div class="info-value">
								<span th:text="${student.age}">0</span> tuổi
								<span
									class="badge bg-warning text-dark ms-2"
									th:if="${student.age < 18}"
								>
									<i
										class="bi bi-exclamation-triangle me-1"
									></i
									>Chưa đủ 18 tuổi
								</span>
								<span
									class="badge bg-success ms-2"
									th:if="${student.age >= 18}"
								>
									<i class="bi bi-check-circle me-1"></i>Đủ
									tuổi
								</span>
							</div>
						</div>
					</div>
				</div>
				<div class="card-footer bg-white p-3">
					<div class="d-flex gap-2 justify-content-center flex-wrap">
						<a
							th:href="@{/students/edit/{id}(id=${student.id})}"
							class="btn btn-warning btn-action text-white"
						>
							<i class="bi bi-pencil-square me-2"></i>Chỉnh sửa
						</a>
						<a
							th:href="@{/students/delete/{id}(id=${student.id})}"
							class="btn btn-danger btn-action"
							onclick="
								return confirm(
									'Bạn có chắc chắn muốn xóa sinh viên này?',
								);
							"
						>
							<i class="bi bi-trash me-2"></i>Xóa
						</a>
						<a
							href="/students"
							class="btn btn-outline-secondary btn-action"
						>
							<i class="bi bi-arrow-left me-2"></i>Quay lại
						</a>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
