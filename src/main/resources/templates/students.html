<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Danh Sách Sinh Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px 15px 0 0 !important;
            padding: 1.5rem;
        }
        .table th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
        }
        .table td {
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background-color: #f1f3f5;
        }
        .btn-action {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }
        .search-box {
            max-width: 400px;
        }
        .age-warning {
            background-color: #fff3cd !important;
        }
        .badge-age {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 text-white">
                        <i class="bi bi-mortarboard-fill me-2"></i>Quản Lý Sinh Viên
                    </h3>
                    <a th:href="@{/students/new}" class="btn btn-light">
                        <i class="bi bi-plus-circle me-1"></i>Thêm Sinh Viên
                    </a>
                </div>
            </div>
            <div class="card-body">
                <!-- Search Form -->
                <form action="/students" method="GET" class="mb-4">
                    <div class="input-group search-box">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" name="keyword" class="form-control" 
                               placeholder="Tìm kiếm theo tên..." th:value="${param.keyword}"/>
                        <button type="submit" class="btn btn-primary">Tìm</button>
                    </div>
                </form>

                <!-- Students Table -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">#</th>
                                <th scope="col">MSSV</th>
                                <th scope="col">Họ và Tên</th>
                                <th scope="col">Email</th>
                                <th scope="col">Tuổi</th>
                                <th scope="col" class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="student, iterStat : ${dsSinhVien}" 
                                th:classappend="${student.age < 18} ? 'age-warning' : ''">
                                <td th:text="${iterStat.index + 1}">1</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${student.id}">ID</span>
                                </td>
                                <td>
                                    <i class="bi bi-person-circle me-1 text-muted"></i>
                                    <span th:text="${student.name}">Tên</span>
                                </td>
                                <td>
                                    <i class="bi bi-envelope me-1 text-muted"></i>
                                    <span th:text="${student.email}">Email</span>
                                </td>
                                <td>
                                    <span class="badge badge-age" 
                                          th:classappend="${student.age < 18} ? 'bg-warning text-dark' : 'bg-success'"
                                          th:text="${student.age} + ' tuổi'">0</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/students/{id}(id=${student.id})}" 
                                       class="btn btn-info btn-action text-white me-1" title="Xem chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/students/edit/{id}(id=${student.id})}" 
                                       class="btn btn-warning btn-action text-white me-1" title="Chỉnh sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                                       class="btn btn-danger btn-action"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');"
                                       title="Xóa">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(dsSinhVien)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                    Không có sinh viên nào
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Summary -->
                <div class="d-flex justify-content-between align-items-center mt-3 text-muted">
                    <span>
                        <i class="bi bi-people me-1"></i>
                        Tổng số: <strong th:text="${#lists.size(dsSinhVien)}">0</strong> sinh viên
                    </span>
                    <small>
                        <span class="badge bg-warning text-dark me-1">Vàng</span> = Dưới 18 tuổi
                    </small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
